<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的商品兑换记录</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f4f5f7; margin: 0; padding: 28px; color: #333; }
        main { max-width: 1000px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        h1 { font-size: 24px; margin: 0; }
        a { color: #1677c8; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .panel { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 10px #0000000d; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 720px; }
        th, td { text-align: left; padding: 13px 12px; border-bottom: 1px solid #eee; }
        th { color: #666; font-weight: 600; background: #fafafa; }
        .empty { text-align: center; color: #888; padding: 42px 10px; }
        .status { display: inline-block; border-radius: 20px; padding: 4px 10px; background: #fff4db; color: #9a6700; }
        @media (max-width: 600px) { body { padding: 16px; } header { align-items: flex-start; gap: 12px; flex-direction: column; } }
    </style>
</head>
<body>
<main>
    <header>
        <h1>生命碎片兑换记录</h1>
        <a th:href="@{/Home}">返回商店</a>
    </header>
    <section class="panel">
        <div th:if="${#lists.isEmpty(orders)}" class="empty">还没有人兑换你的生命碎片。</div>
        <table th:unless="${#lists.isEmpty(orders)}">
            <thead>
            <tr><th>订单编号</th><th>生命碎片</th><th>兑换者</th><th>账号</th><th>兑换时间</th><th>状态</th></tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}"></td>
                <td th:text="${order.fragmentName != null ? order.fragmentName : '生命碎片已删除'}"></td>
                <td th:text="${order.buyerNickname != null ? order.buyerNickname : '未知用户'}"></td>
                <td th:text="${order.buyerUsername != null ? order.buyerUsername : '-'}"></td>
                <td th:text="${order.buyTime != null ? order.buyTime : '-'}"></td>
                <td><span class="status" th:text="${order.status == 0 ? '待处理' : (order.status == 1 ? '已完成' : '状态 ' + order.status)}"></span></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
