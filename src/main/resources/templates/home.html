<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>生命碎片商店</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #333; margin-top: 10px; }
        /* 顶部导航 */
        .top-nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: flex-end;
            padding-bottom: 15px;
            border-bottom: 2px solid #e8e8e8;
            margin-bottom: 20px;
        }
        .top-nav a {
            text-decoration: none;
            color: #1890ff;
            margin-left: 20px;
            font-weight: bold;
        }
        .top-nav a:hover { text-decoration: underline; }
        /* 商品卡片 */
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 15px;
            width: 300px;
        }
        .card p { margin: 8px 0; color: #555; }
        /* 购买按钮 */
        button {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 15px;
        }
        button:hover { background-color: #ff5252; }
    </style>
</head>
<body>

<!----------------------- 顶部导航 ----------------------->
<div class="top-nav">
    <!-- 没登录 -->
    <div th:if="${session.loginUser == null}">
        <a th:href="@{/register}">注册</a>
        <a th:href="@{/login}">登录</a>
    </div>
    <!-- 已登录 -->
    <div th:if="${session.loginUser != null}">
            <span style="color: #333; margin-right: 15px;">
                欢迎你，<strong th:text="${session.loginUser.nickname}"></strong>
            </span>
        <a th:href="@{/logout}">退出登录</a>
        <a th:if="${session.loginUser.role == 'admin'}" th:href="@{/admin/orders}">我的商品兑换记录</a>
    </div>
</div>

<h1 th:text="${welcome}"></h1>
<h5>第一版代码，玩坏了算我的。</h5>

<!----------------------- 商品列表 ----------------------->
<div th:each="item:${fragments}" class="card">
    <p>编号: <span th:text="${item.id}"></span></p>
    <p>生命碎片: <strong th:text="${item.name}"></strong></p>
    <p>价格: <span style="color: #ff6b6b; font-weight: bold;">¥<span th:text="${item.price}"></span></span></p>
    <p>数量: <span th:text="${item.stock}"></span></p>
    <p>是否上架: <span th:text="${item.state == 1 ? '已上架' : '已下架'}"></span></p>
    <a th:href="@{/buy(fragmentId=${item.id})}">
        <button>兑换</button>
    </a>
</div>

<script th:if="${param.buySuccess != null}">
    alert("兑换成功！");
    // 把地址栏的 URL 替换成不带参数的干净地址，但页面不刷新
    window.history.replaceState({}, document.title, "/Home");//应该是清空状态的
</script>

<script th:if="${param.buyError != null}">
    alert("兑换失败:" + "[[${param.buyError}]]");
    window.history.replaceState({}, document.title, "/Home");
</script>

<script th:if="${param.registerSuccess != null}">
    alert("注册成功！");
    window.history.replaceState({}, document.title, "/Home");
</script>

<script th:if="${param.loginSuccess != null}">
    alert("登录成功！");
    window.history.replaceState({}, document.title, "/Home");
</script>

<script th:if="${param.accessDenied != null}">
    alert("只有管理员可以查看该页面。");
    window.history.replaceState({}, document.title, "/Home");
</script>

</body>
</html>
